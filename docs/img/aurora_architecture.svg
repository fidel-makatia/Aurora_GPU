<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .frame  { fill: none; stroke: #1f2937; stroke-width: 1.6; }
      .die    { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.4; }
      .block  { fill: #ffffff; stroke: #475569; stroke-width: 1.1; }
      .accent { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.2; }
      .wire   { stroke: #334155; stroke-width: 1.2; fill: none; }
      .t      { fill: #0f172a; font-size: 14px; }
      .th     { fill: #0f172a; font-size: 15px; font-weight: bold; }
      .ts     { fill: #475569; font-size: 12px; }
      .tc     { fill: #0f172a; font-size: 13px; text-anchor: middle; }
      .tsc    { fill: #475569; font-size: 11.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="12" y="12" width="936" height="616" class="frame"/>
  <text x="32" y="42" class="th">Aurora system architecture</text>
  <text x="32" y="62" class="ts">Package integration: 2.5D interposer (RDL) or 3D face-to-face hybrid bond</text>

  <!-- compute chiplets -->
  <g>
    <rect x="52"  y="92" width="190" height="120" class="die"/>
    <text x="147" y="118" class="tc" font-weight="bold">Compute chiplet 0</text>
    <text x="147" y="146" class="tc">4 × SM (32-lane SIMT)</text>
    <text x="147" y="168" class="tc">L2 slice</text>
    <text x="147" y="190" class="tsc">D2D endpoint</text>

    <rect x="272" y="92" width="190" height="120" class="die"/>
    <text x="367" y="118" class="tc" font-weight="bold">Compute chiplet 1</text>
    <text x="367" y="146" class="tc">4 × SM (32-lane SIMT)</text>
    <text x="367" y="168" class="tc">L2 slice</text>
    <text x="367" y="190" class="tsc">D2D endpoint</text>

    <rect x="492" y="92" width="190" height="120" class="die"/>
    <text x="587" y="118" class="tc" font-weight="bold">Compute chiplet 2</text>
    <text x="587" y="146" class="tc">4 × SM (32-lane SIMT)</text>
    <text x="587" y="168" class="tc">L2 slice</text>
    <text x="587" y="190" class="tsc">D2D endpoint</text>

    <rect x="712" y="92" width="190" height="120" class="die"/>
    <text x="807" y="118" class="tc" font-weight="bold">Compute chiplet 3</text>
    <text x="807" y="146" class="tc">4 × SM (32-lane SIMT)</text>
    <text x="807" y="168" class="tc">L2 slice</text>
    <text x="807" y="190" class="tsc">D2D endpoint</text>
  </g>

  <!-- D2D links -->
  <path class="wire" d="M147 212 V286"/>
  <path class="wire" d="M367 212 V286"/>
  <path class="wire" d="M587 212 V286"/>
  <path class="wire" d="M807 212 V286"/>
  <text x="480" y="250" class="tsc">Die-to-die links: 64-bit payload, 4:1 serialized, 16 bits per direction</text>
  <text x="480" y="268" class="tsc">(5-beat request / 2-beat response)</text>

  <!-- hub die -->
  <rect x="52" y="286" width="850" height="300" class="die"/>
  <text x="76" y="316" class="th">IO / hub chiplet</text>

  <rect x="76" y="336" width="380" height="104" class="accent"/>
  <text x="266" y="366" class="tc" font-weight="bold">RV32IM host CPU</text>
  <text x="266" y="390" class="tc">16 KB boot RAM</text>
  <text x="266" y="412" class="tsc">on-die command processor: boots firmware,</text>
  <text x="266" y="428" class="tsc">uploads kernels, launches, verifies</text>

  <rect x="498" y="336" width="380" height="104" class="block"/>
  <text x="688" y="366" class="tc" font-weight="bold">Command registers</text>
  <text x="688" y="392" class="tc">kernel upload · launch · idle status</text>
  <text x="688" y="418" class="tsc">shared map: on-die CPU and external debug host</text>

  <rect x="76" y="462" width="802" height="100" class="block"/>
  <text x="477" y="492" class="tc" font-weight="bold">Global memory: HBM3 pseudo-channel controller</text>
  <text x="477" y="516" class="tc">16 banks, open-page policy, HBM3-class timing · 64-bit DQ, 51.2 GB/s per pseudo-channel</text>
  <text x="477" y="540" class="tsc">PHY boundary: vendor hard IP (behavioral in simulation; area and energy carried as declared literature bounds)</text>

  <path class="wire" d="M456 388 H498"/>
  <path class="wire" d="M266 440 V462"/>
  <path class="wire" d="M688 440 V462"/>

  <!-- debug port -->
  <path class="wire" d="M52 388 H24"/>
  <text x="24" y="378" class="ts">Wishbone</text>
  <text x="24" y="394" class="ts" font-size="11">debug port</text>
</svg>
